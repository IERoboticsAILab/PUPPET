# controller_manager for the mock TIAGo, with PAL-like trajectory controllers (same names and
# joints as 25.01: tiago_controller_configuration, pal_gripper_controller_configuration).
controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    head_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    torso_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints: [arm_1_joint, arm_2_joint, arm_3_joint, arm_4_joint, arm_5_joint, arm_6_joint, arm_7_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
head_controller:
  ros__parameters:
    joints: [head_1_joint, head_2_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
torso_controller:
  ros__parameters:
    joints: [torso_lift_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
gripper_controller:
  ros__parameters:
    joints: [gripper_right_finger_joint, gripper_left_finger_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
