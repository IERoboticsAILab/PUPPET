# PlayMotion2 on the mock robot: PAL's "home" (tiago_motions_general.yaml) is not needed here,
# a short "home" is enough to test the ArmMotion round trip. "extend" comes from
# config/telepresence_motions.yaml (loaded too).
/**:
  ros__parameters:
    controllers: [arm_controller, head_controller, torso_controller, gripper_controller]
    motions:
      home:
        joints: [torso_lift_joint, arm_1_joint, arm_2_joint, arm_3_joint, arm_4_joint, arm_5_joint, arm_6_joint, arm_7_joint]
        positions: [0.15, 0.20, -1.34, -0.20, 1.94, -1.57, 1.37, 0.0]
        times_from_start: [3.0]
        meta: {name: Home, usage: test, description: home}
      mid:
        joints: [torso_lift_joint, arm_1_joint, arm_2_joint, arm_3_joint, arm_4_joint, arm_5_joint, arm_6_joint, arm_7_joint]
        positions: [0.15, 0.6, -0.4, -0.6, 1.4, 0.3, 0.6, 0.2]
        times_from_start: [3.0]
        meta: {name: Mid, usage: test, description: a pose well inside every joint limit}
