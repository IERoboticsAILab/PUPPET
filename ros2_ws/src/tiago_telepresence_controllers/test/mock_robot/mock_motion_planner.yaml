# PlayMotion2 planner settings for the mock robot: PAL's TIAGo pal-gripper values
# (tiago_bringup/config/motion_planner/motion_planner_pal-gripper.yaml) with MoveIt planning off,
# since the mock robot has no move_group.
/**:
  ros__parameters:
    motion_planner:
      disable_motion_planning: true
      planning_groups: [arm_torso]
      exclude_from_planning_joints: [head_1_joint, head_2_joint, gripper_left_finger_joint, gripper_right_finger_joint]
      joint_tolerance: 0.01
      approach_velocity: 0.5
      approach_min_duration: 0.5
